<template>
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-3">
            <lightning-card title="Domains" icon-name="utility:world">
                <div class="slds-p-horizontal_small slds-p-bottom_small">
                    <lightning-input
                        label="New Domain Name"
                        value={newDomainName}
                        onchange={handleNewDomainNameChange}
                        placeholder="example.com">
                    </lightning-input>
                    <lightning-button
                        class="slds-m-top_x-small"
                        label="Create Domain"
                        variant="brand"
                        onclick={handleCreateDomain}>
                    </lightning-button>
                </div>
                <template lwc:if={hasDomains}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={domains} for:item="d">
                            <li key={d.Id} class="slds-item slds-p-around_small"
                                data-id={d.Id} onclick={handleDomainSelect}>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon icon-name="utility:world" size="small"
                                                   class="slds-m-right_small"></lightning-icon>
                                    <span class="slds-truncate">{d.Name}</span>
                                    <template lwc:if={d.Verified__c}>
                                        <lightning-icon icon-name="utility:success" size="x-small"
                                                       variant="success" class="slds-m-left_x-small"></lightning-icon>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-p-around_medium slds-text-color_weak">No domains found.</p>
                </template>
            </lightning-card>
        </div>

        <div class="slds-col slds-size_2-of-3">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>

            <template lwc:if={hasSelectedDomain}>
                <lightning-card title={selectedDomain.Name} icon-name="utility:world">
                    <lightning-button-group slot="actions">
                        <lightning-button label="Verify" onclick={handleVerifyDomain}></lightning-button>
                        <lightning-button label="Delete" variant="destructive" onclick={handleDeleteDomain}></lightning-button>
                    </lightning-button-group>

                    <div class="slds-p-around_medium">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                <dl>
                                    <dt class="slds-text-title">Owner</dt>
                                    <dd>{selectedDomain.Owner__r.Name}</dd>
                                </dl>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                <dl>
                                    <dt class="slds-text-title">Verified</dt>
                                    <dd>
                                        <lightning-formatted-text value={selectedDomain.Verified__c}></lightning-formatted-text>
                                    </dd>
                                </dl>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                <dl>
                                    <dt class="slds-text-title">Default Policy</dt>
                                    <dd>{selectedDomain.Default_Policy__r.Name}</dd>
                                </dl>
                            </div>
                        </div>

                        <div class="slds-box slds-m-bottom_medium">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">Add Member</h3>
                            <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
                                <div class="slds-col">
                                    <lightning-input
                                        label="User Id"
                                        value={newMemberUserId}
                                        onchange={handleNewMemberUserIdChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col">
                                    <lightning-combobox
                                        label="Role"
                                        value={newMemberRole}
                                        options={roleOptions}
                                        onchange={handleNewMemberRoleChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-grow-none">
                                    <lightning-button
                                        label="Add"
                                        variant="brand"
                                        onclick={handleAddMember}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>

                        <lightning-datatable
                            key-field="Id"
                            data={members}
                            columns={memberColumns}
                            hide-checkbox-column
                            onrowaction={handleMemberRowAction}>
                        </lightning-datatable>
                    </div>
                </lightning-card>
            </template>
        </div>
    </div>
</template>
