<template>
    <lightning-card title="Duplicate Review" icon-name="standard:duplicate_record">
        <lightning-button slot="actions" label="Check for Duplicates" onclick={handleCheck}
                          disabled={isLoading}></lightning-button>

        <div class="slds-p-horizontal_medium">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template lwc:if={hasViolations}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={violations} for:item="violation">
                        <li key={violation.id} class="slds-item slds-p-around_x-small">
                            <div class="slds-grid slds-grid_align-spread slds-wrap">
                                <div class="slds-col slds-size_2-of-3">
                                    <p class="slds-text-heading_small">{violation.merchant}</p>
                                    <p class="slds-text-body_small">
                                        {violation.currency} {violation.amount} &middot; {violation.expenseDate}
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">{violation.message}</p>
                                    <lightning-badge label={violation.status}></lightning-badge>
                                </div>
                                <div class="slds-col slds-size_1-of-3 slds-text-align_right">
                                    <template lwc:if={violation.isOpen}>
                                        <lightning-button label="Keep" data-id={violation.id}
                                                          onclick={handleKeep} class="slds-m-right_x-small"
                                                          disabled={isLoading}></lightning-button>
                                        <lightning-button label="Dismiss" variant="destructive"
                                                          data-id={violation.id} onclick={handleRemove}
                                                          disabled={isLoading}></lightning-button>
                                    </template>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>

            <template lwc:if={hasNoViolations}>
                <p class="slds-p-vertical_medium slds-text-color_weak">
                    No potential duplicates flagged for this expense.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
