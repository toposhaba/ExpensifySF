<template>
    <lightning-card title="Expense Rules" icon-name="standard:rules">
        <div slot="actions">
            <lightning-button
                label="Apply Rules"
                variant="neutral"
                onclick={handleApplyRules}
                class="slds-m-right_x-small"
            ></lightning-button>
            <lightning-button
                label="New Rule"
                variant="brand"
                onclick={handleOpenCreateModal}
            ></lightning-button>
        </div>

        <div class="slds-m-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>

            <lightning-datatable
                key-field="id"
                data={rules}
                columns={columns}
                onrowselection={handleRowSelection}
            ></lightning-datatable>
        </div>
    </lightning-card>

    <template if:true={showCreateModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseCreateModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Create Expense Rule</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Rule Name"
                        data-field="name"
                        value={newRule.name}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Merchant Pattern"
                        data-field="merchantPattern"
                        value={newRule.merchantPattern}
                        onchange={handleInputChange}
                        placeholder="e.g., *UBER*, *LYFT*"
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Category"
                        data-field="category"
                        value={newRule.category}
                        onchange={handleInputChange}
                    ></lightning-input>
                    <lightning-input
                        label="Tag"
                        data-field="tag"
                        value={newRule.tag}
                        onchange={handleInputChange}
                    ></lightning-input>
                    <lightning-input
                        label="Enabled"
                        type="checkbox"
                        data-field="enabled"
                        checked={newRule.enabled}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseCreateModal}></lightning-button>
                    <lightning-button
                        label="Create"
                        variant="brand"
                        onclick={handleCreateRule}
                        disabled={isLoading}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
