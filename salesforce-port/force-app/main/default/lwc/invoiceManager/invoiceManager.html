<template>
    <lightning-card title="Invoice Manager" icon-name="standard:invoice">
        <lightning-button
            label="Create Invoice"
            variant="brand"
            slot="actions"
            onclick={handleOpenCreateModal}
        ></lightning-button>

        <div class="slds-m-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>

            <lightning-datatable
                key-field="id"
                data={invoices}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
            ></lightning-datatable>
        </div>
    </lightning-card>

    <template if:true={showCreateModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseCreateModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Create Invoice</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Recipient Name"
                        data-field="recipientName"
                        value={newInvoice.recipientName}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Recipient Email"
                        type="email"
                        data-field="recipientEmail"
                        value={newInvoice.recipientEmail}
                        onchange={handleInputChange}
                    ></lightning-input>
                    <lightning-input
                        label="Amount"
                        type="number"
                        formatter="currency"
                        data-field="amount"
                        value={newInvoice.amount}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Due Date"
                        type="date"
                        data-field="dueDate"
                        value={newInvoice.dueDate}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                    <lightning-input
                        label="Description"
                        data-field="description"
                        value={newInvoice.description}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseCreateModal}></lightning-button>
                    <lightning-button
                        label="Create"
                        variant="brand"
                        onclick={handleCreateInvoice}
                        disabled={isLoading}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
