<template>
    <lightning-card title="Subscription & Billing" icon-name="utility:money">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox label="Plan" value={plan} options={planOptions}
                        onchange={handlePlanChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input type="number" label="Seats" value={seats} min="0"
                        onchange={handleSeatsChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-combobox label="Billing Cycle" value={billingCycle} options={cycleOptions}
                        onchange={handleCycleChange}></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input type="text" label="Currency" value={currencyCode} max-length="3"
                        onchange={handleCurrencyChange}></lightning-input>
                </div>
            </div>
            <lightning-button variant="brand" label="Create Subscription" onclick={handleCreate}></lightning-button>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={hasSubscriptions}>
                <lightning-datatable key-field="Id" data={subscriptions} columns={columns}
                    max-row-selection="1" onrowselection={handleRowSelection}>
                </lightning-datatable>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak">No subscriptions yet.</p>
            </template>
        </div>

        <template lwc:if={hasSelection}>
            <div class="slds-p-around_medium slds-box slds-m-horizontal_medium slds-m-bottom_medium">
                <div class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox label="Change Plan To" value={changePlanValue}
                            options={planOptions} onchange={handleChangePlanValue}></lightning-combobox>
                        <lightning-button class="slds-m-top_x-small" label="Change Plan"
                            onclick={handleChangePlan}></lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-input type="number" label="New Seats" value={newSeats} min="0"
                            onchange={handleNewSeatsChange}></lightning-input>
                        <lightning-button class="slds-m-top_x-small" label="Update Seats"
                            onclick={handleUpdateSeats}></lightning-button>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-button variant="destructive" label="Cancel Subscription"
                            onclick={handleCancel}></lightning-button>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
