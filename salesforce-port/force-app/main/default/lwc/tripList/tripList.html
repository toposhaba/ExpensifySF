<template>
    <lightning-card title="My Trips" icon-name="standard:trip">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <lightning-datatable
            key-field="Id"
            data={trips}
            columns={tripColumns}
            onrowaction={handleRowAction}
            hide-checkbox-column>
        </lightning-datatable>

        <template lwc:if={hasSelectedTrip}>
            <div class="slds-m-top_medium slds-p-horizontal_small">
                <h3 class="slds-text-heading_small slds-m-bottom_x-small">Reservations</h3>

                <template lwc:if={isLoadingReservations}>
                    <lightning-spinner alternative-text="Loading reservations"></lightning-spinner>
                </template>

                <template lwc:if={hasReservations}>
                    <lightning-datatable
                        key-field="Id"
                        data={reservations}
                        columns={reservationColumns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </template>
                <template lwc:else>
                    <p class="slds-text-color_weak">No reservations for this trip.</p>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
