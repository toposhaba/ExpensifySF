<template>
    <div class="slds-grid">
        <!-- Workspace List Sidebar -->
        <div class="slds-col slds-size_1-of-4 slds-p-right_small">
            <lightning-card title="Workspaces" icon-name="utility:company">
                <template lwc:if={hasPolicies}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={policies} for:item="p">
                            <li key={p.Id} class="slds-item slds-p-around_small"
                                data-id={p.Id} onclick={handlePolicySelect}>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon icon-name="utility:company" size="small"
                                                   class="slds-m-right_small"></lightning-icon>
                                    <span>{p.Name}</span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="slds-p-around_medium slds-text-color_weak">No workspaces found.</p>
                </template>
            </lightning-card>
        </div>

        <!-- Workspace Detail -->
        <div class="slds-col slds-size_3-of-4">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>

            <template lwc:if={selectedPolicyId}>
                <lightning-card title={policy.Name}>
                    <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>
                        <lightning-tab label="Overview" value="overview">
                            <div class="slds-p-around_medium">
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Type</dt>
                                            <dd>{policy.Type__c}</dd>
                                        </dl>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Currency</dt>
                                            <dd>{policy.Currency__c}</dd>
                                        </dl>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Approval Mode</dt>
                                            <dd>{policy.Approval_Mode__c}</dd>
                                        </dl>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Max Expense Amount</dt>
                                            <dd>
                                                <lightning-formatted-number value={policy.Max_Expense_Amount__c}
                                                    format-style="currency" currency-code={policy.Currency__c}>
                                                </lightning-formatted-number>
                                            </dd>
                                        </dl>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Receipt Required Above</dt>
                                            <dd>
                                                <lightning-formatted-number value={policy.Receipt_Required_Amount__c}
                                                    format-style="currency" currency-code={policy.Currency__c}>
                                                </lightning-formatted-number>
                                            </dd>
                                        </dl>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                                        <dl>
                                            <dt class="slds-text-title">Auto Approve Limit</dt>
                                            <dd>
                                                <lightning-formatted-number value={policy.Auto_Approve_Limit__c}
                                                    format-style="currency" currency-code={policy.Currency__c}>
                                                </lightning-formatted-number>
                                            </dd>
                                        </dl>
                                    </div>
                                </div>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Members" value="members">
                            <div class="slds-p-around_medium">
                                <lightning-datatable key-field="Id" data={members}
                                    columns={memberColumns} hide-checkbox-column>
                                </lightning-datatable>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Categories" value="categories">
                            <div class="slds-p-around_medium">
                                <lightning-datatable key-field="Id" data={categories}
                                    columns={categoryColumns} hide-checkbox-column>
                                </lightning-datatable>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Tags" value="tags">
                            <div class="slds-p-around_medium">
                                <lightning-datatable key-field="Id" data={tags}
                                    columns={tagColumns} hide-checkbox-column>
                                </lightning-datatable>
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </lightning-card>
            </template>
        </div>
    </div>
</template>
